[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-engine"
version = "0.0.2"
description = "Convenient new frontend framework"
readme = "README.md"
authors = [
    { name = "SYSCON International", email = "dev@syscon-intl.com" }
]
dependencies = [
    "Django>=4.2.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/SYSCON-International/galaxy_engine"
Repository = "https://github.com/SYSCON-International/galaxy_engine"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "galaxy_engine",
    "galaxy_engine.*",
]
exclude = [
    "documentation_app",
    "documentation_app.*",
]
namespaces = false

[tool.setuptools.package-data]
galaxy_engine = [
    "static/**/*",
    "templates/**/*",
]